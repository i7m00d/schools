<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>علم البيئة</title>
  <style>
    :root {
      --navy: #1e3a8a;
      --gold: #d97706;
      --gold-soft: #fef3c7;
      --ink: #1f2937;
      --ink-soft: #6b7280;
      --line: #e5e7eb;
      --accent: #2a5298;
      --accent-bg: #eff6ff;
      --accent-soft: #bfdbfe;
      --green: #059669;
      --green-bg: #ecfdf5;
      --red: #dc2626;
      --red-bg: #fef2f2;
    }
    body { font-family: 'Tajawal', sans-serif; background: #f9fafb; padding: 20px; }
    .q-card { background: #fff; padding: 20px; border-radius: 16px; border: 1.5px solid var(--line); margin-bottom: 20px; }
    .q-head { display: flex; gap: 11px; margin-bottom: 13px; }
    .q-num { font-weight: 700; color: #fff; background: var(--navy); padding: 5px 10px; border-radius: 8px; }
    .q-text { font-size: 18px; font-weight: 500; }
    .q-type-badge { font-size: 12px; background: var(--accent-bg); color: var(--accent); padding: 2px 8px; border-radius: 20px; margin-right: auto; }
    
    .ans-input, .ans-textarea { width:100%; font-family:'Tajawal'; font-size:17px; color:var(--ink); padding:15px 16px; border:1.5px solid var(--line); border-radius:12px; background:#f8fafc; transition:.15s; }
    .ans-textarea { resize:vertical; min-height:80px; }
    .ans-input:focus, .ans-textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    
    .hint { font-size:12px; color:var(--ink-soft); margin-top:7px; }
    
    .tf-row { display: flex; gap: 10px; margin-top: 10px; }
    .tf-btn { flex: 1; padding: 12px; border-radius: 8px; border: 1.5px solid var(--line); cursor: pointer; background: #fff; }
    .tf-btn:hover { background: var(--accent-bg); }
    
    .opts { display: flex; flex-direction: column; gap: 9px; }
    .opt { padding: 15px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
    .opt:hover { background: var(--accent-bg); }
    
    .verdict { margin-top: 15px; padding: 10px; border-radius: 8px; font-weight: bold; }
    .verdict.ok { background: var(--green-bg); color: var(--green); }
    .verdict.no { background: var(--red-bg); color: var(--red); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="ecology-bank.js"></script>
  <script>
    const TYPE_LABEL = { "essay": "مقالي", "fill": "إكمال", "tf": "صح/خطأ", "mcq": "اختيار", "correct": "تصويب" };
    const $$ = (sel, el) => Array.from(el.querySelectorAll(sel));
    const $ = (sel, el) => el.querySelector(sel);
    
    let answers = {};
    const app = document.getElementById("app");

    ECOLOGY_BANK.units.forEach(u => {
      u.sections.forEach(s => {
        s.questions.forEach((q, i) => {
          const qid = u.id + "_" + i;
          const card = document.createElement("div");
          card.className = "q-card";
          
          let body = "";
          if (q.type === "essay") {
            body = `<textarea class="ans-textarea" placeholder="اكتب إجابتك..."></textarea>`;
          } else if (q.type === "fill") {
            body = `<input class="ans-input" type="text" placeholder="اكتب إجابتك...">`;
          } else if (q.type === "tf") {
            body = `<div class="tf-row"><button class="tf-btn">✓ صح</button><button class="tf-btn">✗ خطأ</button></div>`;
          } else if (q.type === "mcq") {
            body = `<div class="opts">${q.options.map(o => `<div class="opt">${o}</div>`).join("")}</div>`;
          }

          card.innerHTML = `
            <div class="q-head">
              <span class="q-num">${i + 1}</span>
              <span class="q-text">${q.q}</span>
              <span class="q-type-badge">${TYPE_LABEL[q.type]}</span>
            </div>
            ${body}
          `;
          app.appendChild(card);
        });
      });
    });
  </script>
</body>
</html>
